<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">Cloudflare：域名与本机服务怎么填</title><desc id="desc">保留协议和端口示例；把 example.com 换成你自己的域名。</desc><rect width="1100" height="610" fill="#f4f7fb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="62" font-size="32" fill="#172033">Cloudflare：域名与本机服务怎么填</text><text x="45" y="100" font-size="18" fill="#596579">保留协议和端口示例；把 example.com 换成你自己的域名。</text><rect x="45" y="139" width="605" height="385" rx="16" fill="#ffffff" stroke="#dce3ed"/><text x="72" y="182" font-size="25" fill="#172033">公开应用路由 · 需要填写的字段</text><text x="73" y="224" font-size="19" fill="#596579">子域名</text><rect x="228" y="194" width="392" height="44" rx="16" fill="#f7f9fc" stroke="#dce3ed"/><text x="245" y="224" font-size="21" fill="#172033">hermes</text><text x="73" y="282" font-size="19" fill="#596579">域名</text><rect x="228" y="252" width="392" height="44" rx="16" fill="#f7f9fc" stroke="#dce3ed"/><text x="245" y="282" font-size="21" fill="#172033">example.com</text><text x="73" y="340" font-size="19" fill="#596579">路径</text><rect x="228" y="310" width="392" height="44" rx="16" fill="#f7f9fc" stroke="#dce3ed"/><text x="245" y="340" font-size="21" fill="#172033">留空</text><text x="73" y="398" font-size="19" fill="#596579">服务类型</text><rect x="228" y="368" width="392" height="44" rx="16" fill="#f7f9fc" stroke="#dce3ed"/><text x="245" y="398" font-size="21" fill="#172033">HTTP</text><text x="73" y="456" font-size="19" fill="#596579">服务地址</text><rect x="228" y="426" width="392" height="44" rx="16" fill="#f7f9fc" stroke="#dce3ed"/><text x="245" y="456" font-size="21" fill="#172033">127.0.0.1:5174</text><text x="686" y="205" font-size="22" fill="#2469dc">手机访问</text><text x="686" y="245" font-size="20" fill="#172033">https://hermes.example.com</text><text x="686" y="314" font-size="22" fill="#2469dc">隧道转发到本机</text><text x="686" y="354" font-size="20" fill="#172033">http://127.0.0.1:5174</text><text x="686" y="433" font-size="20" fill="#172033">不要填 9119 或代理端口</text><text x="686" y="472" font-size="18" fill="#596579">实际菜单名称以控制台为准</text><text x="45" y="584" font-size="16" fill="#68768b">Hermes Web Shell · 操作示意，非实际界面截图 · 仅使用示例数据</text></g></svg>