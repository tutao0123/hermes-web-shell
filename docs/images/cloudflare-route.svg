<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">Cloudflare: domain and origin settings</title><desc id="desc">Use your own domain in place of example.com.</desc><rect width="1100" height="610" fill="#f4f7fb" /><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="62" font-size="32" fill="#172033">Cloudflare: domain and origin settings</text><text x="45" y="100" font-size="18" fill="#596579">Use your own domain in place of example.com.</text><rect x="45" y="139" width="605" height="385" rx="16" fill="#ffffff" stroke="#dce3ed" /><text x="72" y="182" font-size="25" fill="#172033">Published application route</text><text x="73" y="224" font-size="19" fill="#596579">Subdomain</text><rect x="228" y="194" width="392" height="44" rx="16" fill="#f7f9fc" stroke="#dce3ed" /><text x="245" y="224" font-size="21" fill="#172033">hermes</text><text x="73" y="282" font-size="19" fill="#596579">Domain</text><rect x="228" y="252" width="392" height="44" rx="16" fill="#f7f9fc" stroke="#dce3ed" /><text x="245" y="282" font-size="21" fill="#172033">example.com</text><text x="73" y="340" font-size="19" fill="#596579">Path</text><rect x="228" y="310" width="392" height="44" rx="16" fill="#f7f9fc" stroke="#dce3ed" /><text x="245" y="340" font-size="21" fill="#172033">Leave empty</text><text x="73" y="398" font-size="19" fill="#596579">Service type</text><rect x="228" y="368" width="392" height="44" rx="16" fill="#f7f9fc" stroke="#dce3ed" /><text x="245" y="398" font-size="21" fill="#172033">HTTP</text><text x="73" y="456" font-size="19" fill="#596579">Service URL</text><rect x="228" y="426" width="392" height="44" rx="16" fill="#f7f9fc" stroke="#dce3ed" /><text x="245" y="456" font-size="21" fill="#172033">127.0.0.1:5174</text><text x="686" y="205" font-size="22" fill="#2469dc">Phone connects to</text><text x="686" y="245" font-size="20" fill="#172033">https://hermes.example.com</text><text x="686" y="314" font-size="22" fill="#2469dc">Tunnel forwards to</text><text x="686" y="354" font-size="20" fill="#172033">http://127.0.0.1:5174</text><text x="686" y="433" font-size="19.6" fill="#172033">Not port 9119 or your proxy port</text><text x="686" y="472" font-size="18" fill="#596579">Dashboard labels may differ</text><text x="45" y="584" font-size="16" fill="#68768b">Hermes Web Shell | Illustration, not a screenshot | Example data only</text></g></svg>