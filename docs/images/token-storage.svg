<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">Cloudflare token：复制到哪里</title><desc id="desc">示意图没有真实 token、账号 ID 或个人文件路径；黑块只是占位。</desc><rect width="1100" height="610" fill="#f4f7fb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="62" font-size="32" fill="#172033">Cloudflare token：复制到哪里</text><text x="45" y="100" font-size="18" fill="#596579">示意图没有真实 token、账号 ID 或个人文件路径；黑块只是占位。</text><rect x="45" y="145" width="1010" height="125" rx="16" fill="#ffffff" stroke="#dce3ed"/><text x="70" y="188" font-size="22" fill="#172033">Cloudflare 提供的连接器命令（格式示意）</text><text x="70" y="236" font-size="24" fill="#172033">cloudflared tunnel run --token</text><rect x="505" y="206" width="515" height="42" rx="16" fill="#192337" stroke="#192337"/><text x="526" y="235" font-size="20" fill="#ffffff">TOKEN 已隐藏</text><text x="520" y="316" font-size="22" fill="#2469dc">↓ 只复制 token 字符串，不复制整条命令</text><rect x="45" y="347" width="1010" height="153" rx="16" fill="#ffffff" stroke="#dce3ed"/><text x="70" y="390" font-size="23" fill="#172033">保存到本机文件</text><text x="70" y="430" font-size="22" fill="#172033">%USERPROFILE%\.hermes-web-shell\tunnel-token.txt</text><rect x="70" y="448" width="710" height="30" rx="16" fill="#192337" stroke="#192337"/><text x="807" y="471" font-size="19" fill="#596579">内容不展示</text><text x="45" y="548" font-size="21" fill="#172033">隧道 token ≠ 网页访问密码；不要上传文件、完整命令或凭证截图。</text><text x="45" y="584" font-size="16" fill="#68768b">Hermes Web Shell · 操作示意，非实际界面截图 · 仅使用示例数据</text></g></svg>