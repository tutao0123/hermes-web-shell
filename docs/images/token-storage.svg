<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">Cloudflare token: where to save it</title><desc id="desc">No real token, account ID, or personal path is included. Black boxes are placeholders.</desc><rect width="1100" height="610" fill="#f4f7fb" /><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="62" font-size="32" fill="#172033">Cloudflare token: where to save it</text><text x="45" y="100" font-size="18" fill="#596579">No real token, account ID, or personal path is included. Black boxes are placeholders.</text><rect x="45" y="145" width="1010" height="125" rx="16" fill="#ffffff" stroke="#dce3ed" /><text x="70" y="188" font-size="22" fill="#172033">Connector command (example format)</text><text x="70" y="236" font-size="24" fill="#172033">cloudflared tunnel run --token</text><rect x="505" y="206" width="515" height="42" rx="16" fill="#192337" stroke="#192337" /><text x="526" y="235" font-size="20" fill="#ffffff">TOKEN HIDDEN</text><text x="520" y="316" font-size="22" fill="#2469dc">↓ Copy only the token, not the command</text><rect x="45" y="347" width="1010" height="153" rx="16" fill="#ffffff" stroke="#dce3ed" /><text x="70" y="390" font-size="23" fill="#172033">Save in this local file</text><text x="70" y="430" font-size="22" fill="#172033">%USERPROFILE%\.hermes-web-shell\tunnel-token.txt</text><rect x="70" y="448" width="710" height="30" rx="16" fill="#192337" stroke="#192337" /><text x="807" y="471" font-size="19" fill="#596579">Hidden</text><text x="45" y="548" font-size="21" fill="#172033">Tunnel token is not your login password. Never publish either credential.</text><text x="45" y="584" font-size="16" fill="#68768b">Hermes Web Shell | Illustration, not a screenshot | Example data only</text></g></svg>