<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">Open the window. Scan to connect.</title><desc id="desc">Simplified illustration with English labels; the native window currently uses Chinese.</desc><rect width="1100" height="610" fill="#f4f7fb" /><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="62" font-size="32" fill="#172033">Open the window. Scan to connect.</text><text x="45" y="100" font-size="18" fill="#596579">Simplified illustration with English labels; the native window currently uses Chinese.</text><rect x="45" y="142" width="475" height="392" rx="16" fill="#ffffff" stroke="#dce3ed" /><text x="77" y="185" font-size="26" fill="#172033">Hermes | Connect phone</text><rect x="152" y="213" width="250" height="220" rx="16" fill="#192337" stroke="#192337" /><text x="186" y="315" font-size="24" fill="#ffffff">QR CODE HIDDEN</text><text x="183" y="352" font-size="19" fill="#ced9ed">Not scannable</text><rect x="77" y="460" width="192" height="45" rx="16" fill="#edf3ff" stroke="#dce3ed" /><text x="105" y="490" font-size="21" fill="#172033">Refresh QR</text><rect x="288" y="460" width="198" height="45" rx="16" fill="#edf3ff" stroke="#dce3ed" /><text x="315" y="490" font-size="21" fill="#172033">Devices</text><text x="560" y="194" font-size="24" fill="#172033">1. Open the Connect phone launcher</text><text x="560" y="247" font-size="22.2" fill="#172033">2. Scan the real code on your computer</text><text x="560" y="300" font-size="21.1" fill="#172033">3. Open in your phone browser to sign in</text><text x="560" y="378" font-size="23" fill="#2469dc">Five minutes | Single use</text><text x="560" y="426" font-size="21" fill="#172033">Expired or used? Refresh and scan again.</text><text x="560" y="474" font-size="19.6" fill="#596579">Closing this window keeps services running.</text><text x="45" y="584" font-size="16" fill="#68768b">Hermes Web Shell | Illustration, not a screenshot | Example data only</text></g></svg>