<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">打开窗口，手机扫一扫</title><desc id="desc">窗口布局为说明操作而简化；真实二维码请在自己的电脑上生成。</desc><rect width="1100" height="610" fill="#f4f7fb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="62" font-size="32" fill="#172033">打开窗口，手机扫一扫</text><text x="45" y="100" font-size="18" fill="#596579">窗口布局为说明操作而简化；真实二维码请在自己的电脑上生成。</text><rect x="45" y="142" width="475" height="392" rx="16" fill="#ffffff" stroke="#dce3ed"/><text x="77" y="185" font-size="26" fill="#172033">Hermes · 连接手机</text><rect x="152" y="213" width="250" height="220" rx="16" fill="#192337" stroke="#192337"/><text x="186" y="315" font-size="24" fill="#ffffff">二维码已隐藏</text><text x="183" y="352" font-size="19" fill="#ced9ed">文档图片不可扫码</text><rect x="77" y="460" width="192" height="45" rx="16" fill="#edf3ff" stroke="#dce3ed"/><text x="105" y="490" font-size="21" fill="#172033">刷新二维码</text><rect x="288" y="460" width="198" height="45" rx="16" fill="#edf3ff" stroke="#dce3ed"/><text x="315" y="490" font-size="21" fill="#172033">已连接设备</text><text x="560" y="194" font-size="24" fill="#172033">1. 双击「连接手机.vbs」</text><text x="560" y="247" font-size="23" fill="#172033">2. 扫描自己电脑窗口里的真实二维码</text><text x="560" y="300" font-size="23" fill="#172033">3. 在手机浏览器中打开，自动登录</text><text x="560" y="378" font-size="23" fill="#2469dc">有效期 5 分钟 · 只能使用一次</text><text x="560" y="426" font-size="21" fill="#172033">过期或已使用：点击刷新，再扫码</text><text x="560" y="474" font-size="21" fill="#596579">关闭窗口不会停止后台服务</text><text x="45" y="584" font-size="16" fill="#68768b">Hermes Web Shell · 操作示意，非实际界面截图 · 仅使用示例数据</text></g></svg>