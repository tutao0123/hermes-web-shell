<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">从电脑到手机，只需要这一条连接</title><desc id="desc">先完成一次配置，再使用二维码配对。手机不需要安装 Hermes。</desc><rect width="1100" height="610" fill="#f4f7fb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="62" font-size="32" fill="#172033">从电脑到手机，只需要这一条连接</text><text x="45" y="100" font-size="18" fill="#596579">先完成一次配置，再使用二维码配对。手机不需要安装 Hermes。</text><rect x="45" y="165" width="300" height="230" rx="16" fill="#ffffff" stroke="#dce3ed"/><text x="69" y="208" font-size="24" fill="#2469dc">01</text><text x="69" y="257" font-size="26" fill="#172033">电脑运行服务</text><text x="69" y="307" font-size="20" fill="#596579">Hermes + Web Shell</text><text x="69" y="342" font-size="20" fill="#596579">本机端口 5174</text><rect x="400" y="165" width="300" height="230" rx="16" fill="#ffffff" stroke="#dce3ed"/><text x="424" y="208" font-size="24" fill="#2469dc">02</text><text x="424" y="257" font-size="26" fill="#172033">Cloudflare 隧道</text><text x="424" y="307" font-size="20" fill="#596579">连接你的公开域名</text><text x="424" y="342" font-size="20" fill="#596579">hermes.example.com</text><rect x="755" y="165" width="300" height="230" rx="16" fill="#ffffff" stroke="#dce3ed"/><text x="779" y="208" font-size="24" fill="#2469dc">03</text><text x="779" y="257" font-size="26" fill="#172033">手机扫码使用</text><text x="779" y="307" font-size="20" fill="#596579">登录保留 30 天</text><text x="779" y="342" font-size="20" fill="#596579">下次可直接打开域名</text><text x="356" y="292" font-size="32" fill="#2469dc">→</text><text x="711" y="292" font-size="32" fill="#2469dc">→</text><rect x="45" y="433" width="1010" height="93" rx="16" fill="#eaf1ff" stroke="#c7d9fa"/><text x="70" y="470" font-size="22" fill="#172033">首次：安装 → 手动配置隧道与域名 → 验证访问</text><text x="70" y="506" font-size="21" fill="#172033">以后：双击「连接手机」→ 手机扫码；电脑和隧道需持续运行</text><text x="45" y="584" font-size="16" fill="#68768b">Hermes Web Shell · 操作示意，非实际界面截图 · 仅使用示例数据</text></g></svg>