<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">From your computer to your phone</title><desc id="desc">Configure once, then pair. Your phone does not need Hermes installed.</desc><rect width="1100" height="610" fill="#f4f7fb" /><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="62" font-size="32" fill="#172033">From your computer to your phone</text><text x="45" y="100" font-size="18" fill="#596579">Configure once, then pair. Your phone does not need Hermes installed.</text><rect x="45" y="165" width="300" height="230" rx="16" fill="#ffffff" stroke="#dce3ed" /><text x="69" y="208" font-size="24" fill="#2469dc">01</text><text x="69" y="257" font-size="26" fill="#172033">Computer</text><text x="69" y="307" font-size="20" fill="#596579">Hermes + Web Shell</text><text x="69" y="342" font-size="20" fill="#596579">Local port 5174</text><rect x="400" y="165" width="300" height="230" rx="16" fill="#ffffff" stroke="#dce3ed" /><text x="424" y="208" font-size="24" fill="#2469dc">02</text><text x="424" y="257" font-size="25.9" fill="#172033">Cloudflare Tunnel</text><text x="424" y="307" font-size="20" fill="#596579">Your public domain</text><text x="424" y="342" font-size="20" fill="#596579">hermes.example.com</text><rect x="755" y="165" width="300" height="230" rx="16" fill="#ffffff" stroke="#dce3ed" /><text x="779" y="208" font-size="24" fill="#2469dc">03</text><text x="779" y="257" font-size="26" fill="#172033">Phone</text><text x="779" y="307" font-size="20" fill="#596579">Signed in for 30 days</text><text x="779" y="342" font-size="20" fill="#596579">Reopen your domain</text><text x="356" y="292" font-size="32" fill="#2469dc">→</text><text x="711" y="292" font-size="32" fill="#2469dc">→</text><rect x="45" y="433" width="1010" height="93" rx="16" fill="#eaf1ff" stroke="#c7d9fa" /><text x="70" y="470" font-size="22" fill="#172033">First time: install → configure tunnel and domain → verify access</text><text x="70" y="506" font-size="21" fill="#172033">Everyday: open Connect phone → scan; keep the computer and tunnel running</text><text x="45" y="584" font-size="16" fill="#68768b">Hermes Web Shell | Illustration, not a screenshot | Example data only</text></g></svg>