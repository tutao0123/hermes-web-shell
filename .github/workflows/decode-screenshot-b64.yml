name: Decode screenshot base64 sidecars

on:
  push:
    branches: [main]
    paths:
      - 'docs/screenshots/*.b64'
      - 'docs/screenshots/B64_MANIFEST.txt'
      - 'docs/screenshots/*.b64.part*'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble parts or decode whole b64
        run: |
          set -euo pipefail
          cd docs/screenshots
          shopt -s nullglob
          if [ -f B64_MANIFEST.txt ]; then
            while read -r out parts; do
              [ -z "${out:-}" ] && continue
              echo "Building $out from parts"
              : > "$out.b64"
              for p in $parts; do
                cat "$p" >> "$out.b64"
              done
              base64 -d "$out.b64" > "$out"
              magic=$(xxd -p -l 8 "$out")
              echo "magic=$magic size=$(wc -c < "$out")"
              test "$magic" = "89504e470d0a1a0a"
              rm -f "$out.b64" $parts
            done < B64_MANIFEST.txt
            rm -f B64_MANIFEST.txt
          fi
          for f in *.b64; do
            [ -e "$f" ] || continue
            out="${f%.b64}"
            echo "Decoding $f -> $out"
            base64 -d "$f" > "$out"
            magic=$(xxd -p -l 8 "$out")
            echo "magic=$magic"
            test "$magic" = "89504e470d0a1a0a"
            rm -f "$f"
          done
      - name: Commit PNGs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png 2>/dev/null || true
          git add -u docs/screenshots/ || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add phone screenshots for hello and demo sessions"
          git push
