name: Decode screenshot base64 sidecars

on:
  push:
    branches: [main]
    paths:
      - 'docs/screenshots/*.b64'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode .b64 to PNG and remove sidecars
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(docs/screenshots/*.b64)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .b64 files"
            exit 0
          fi
          for f in "${files[@]}"; do
            out="${f%.b64}"
            echo "Decoding $f -> $out"
            base64 -d "$f" > "$out"
            magic=$(xxd -p -l 8 "$out")
            echo "magic=$magic"
            test "$magic" = "89504e470d0a1a0a"
            rm -f "$f"
          done
      - name: Commit PNGs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png 2>/dev/null || true
          git add -u docs/screenshots/ || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add phone screenshots for hello and demo sessions"
          git push
