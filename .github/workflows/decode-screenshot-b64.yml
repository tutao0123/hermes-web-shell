name: Decode screenshot base64 sidecars

on:
  push:
    branches: [main]
    paths:
      - 'docs/screenshots/B64_READY'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode whole .b64 files to PNG
        run: |
          set -euo pipefail
          cd docs/screenshots
          shopt -s nullglob
          files=(*.b64)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .b64 files"
            exit 1
          fi
          for f in "${files[@]}"; do
            out="${f%.b64}"
            echo "Decoding $f -> $out"
            tr -d '\n\r ' < "$f" | base64 -d > "$out"
            magic=$(xxd -p -l 8 "$out")
            echo "magic=$magic size=$(wc -c < "$out")"
            test "$magic" = "89504e470d0a1a0a"
            rm -f "$f"
          done
          # cleanup any leftover parts/manifest/ready
          rm -f B64_MANIFEST.txt B64_READY *.b64.part* || true
      - name: Commit PNGs and remove helper workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png 2>/dev/null || true
          git add -u docs/screenshots/ || true
          git rm -f .github/workflows/decode-screenshot-b64.yml || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add phone screenshots for hello and demo sessions"
          git push
