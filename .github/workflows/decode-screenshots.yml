name: Decode screenshot base64

on:
  push:
    branches: [main]
    paths:
      - 'docs/screenshots/**'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and decode b64 to PNG
        run: |
          set -euo pipefail
          cd docs/screenshots
          echo '' | base64 -d > /tmp/decode_screenshots.py
          python3 /tmp/decode_screenshots.py

      - name: Commit and push PNGs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add decoded phone screenshots"
          git push
