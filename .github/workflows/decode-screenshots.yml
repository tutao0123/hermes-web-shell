name: Decode screenshot base64

# Run only after all parts have been uploaded. Ordinary screenshot commits
# should contain the original PNG files and do not need this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and decode complete screenshots
        run: python3 scripts/decode_screenshots.py
      - name: Download decoded PNGs
        uses: actions/upload-artifact@v4
        with:
          name: decoded-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
